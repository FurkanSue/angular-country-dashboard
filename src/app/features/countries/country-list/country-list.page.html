<ion-header>
  <ion-toolbar>
    <ion-title>Countries</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Loading -->
  <ion-spinner *ngIf="isLoading"></ion-spinner>

  <!-- Error -->
  <ion-text color="danger" *ngIf="error">
    {{ error }}
  </ion-text>

  <!-- Search -->
  <ion-searchbar placeholder="Search country name or code" (ionInput)="onSearch($event)">
  </ion-searchbar>

  <!-- Filter -->
  <ion-select placeholder="Filter by region" (ionChange)="onRegionChange($event)">
    <ion-select-option value="">All</ion-select-option>
    <ion-select-option value="Africa">Africa</ion-select-option>
    <ion-select-option value="North America">North America</ion-select-option>
    <ion-select-option value="South America">South America</ion-select-option>
    <ion-select-option value="Asia">Asia</ion-select-option>
    <ion-select-option value="Europe">Europe</ion-select-option>
    <ion-select-option value="Oceania">Oceania</ion-select-option>
  </ion-select>

  <!-- Country List -->
  <ion-list *ngIf="!isLoading && !error">
    <ion-item *ngFor="let country of filteredCountries" [routerLink]="['/countries', country.code]">
      {{ country.name }} ({{country.code}})
    </ion-item>
  </ion-list>

  <!-- Empty State -->
  <ion-text *ngIf="!isLoading && !error && filteredCountries.length === 0">
    No countries found.
  </ion-text>

</ion-content>
